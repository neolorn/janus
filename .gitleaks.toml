# OPS-DEP-004: the default rule set, and allow-list entries only. Each entry names one
# file and the one value it exempts, both of which must match, and gives the reason. The
# offline leaked-password list's entry names the list's line form instead of a value.

[extend]
useDefault = true

[[allowlists]]
description = "an item identifier in a documentation comment"
condition = "AND"
paths = ['''^\Qsrc/Janus.Core/IAuditTrail.cs\E$''']
regexes = ['''^PRIV-BREACH-002$''']

[[allowlists]]
description = "SHA-1 hashes of leaked passwords (AUTH-PASS-004)"
condition = "AND"
regexTarget = "line"
paths = ['''^\Qsrc/Janus.Hosting/Passwords/leaked-passwords.txt\E$''']
# The scanner's line carries the line break before it, except on a diff's first line.
regexes = ['''^\n?[0-9A-F]{40}$''']
