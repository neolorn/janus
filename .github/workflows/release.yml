name: release

# LIB-PKG-003 and CONV-VCS-005 (D-245): a v* tag's release carries every package of
# LIB-PKG-001, the Janus.Cli tool package and Janus.Testing, packed at the tag's MinVer
# version, a pre-release for -rc.N. A tag whose version has no changelog section makes
# no release. Nothing is published to a registry, and no registry credential is held:
# consumers take the packages from the release.

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # MinVer reads the version from the tag and the history behind it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The changelog has a section for the version
        run: |
          version=${GITHUB_REF_NAME#v}

          if ! [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-rc[.][1-9][0-9]*)?$ ]]; then
            echo "The tag ${GITHUB_REF_NAME} names no version of the form X.Y.Z or X.Y.Z-rc.N."
            exit 1
          fi

          # D-260: the section is the body where it fits, and is attached where it does not.
          if ! ./.github/gates/release-notes.sh "$version" CHANGELOG.md "$RUNNER_TEMP/notes" "$GITHUB_REPOSITORY"; then
            echo "CHANGELOG.md has no section for ${version}, so no release is made."
            exit 1
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: dotnet pack Janus.slnx --configuration Release --no-restore --output "$RUNNER_TEMP/packages"
      - name: Every package is packed at the tag's version
        run: |
          version=${GITHUB_REF_NAME#v}
          status=0

          for package in Janus.Hosting Janus.Conformance Janus.Analyzers Janus.Cli Janus.Testing; do
            if [ ! -f "$RUNNER_TEMP/packages/${package}.${version}.nupkg" ]; then
              echo "${package} is not packed at ${version}."
              status=1
            fi
          done

          exit "$status"
      - name: The tag's release carries the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          candidate=()
          attached=()

          if [ "${version%%-rc.*}" != "$version" ]; then
            candidate=(--prerelease)
          fi

          if [ -f "$RUNNER_TEMP/notes/release-notes-${version}.md" ]; then
            attached=("$RUNNER_TEMP/notes/release-notes-${version}.md")
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes/body.md" \
            "${candidate[@]}" \
            "$RUNNER_TEMP"/packages/*.nupkg \
            "${attached[@]}"
