name: gates

# CONV-GATE-001 lists what the pipeline blocks on; one job per row, so each row is a
# status check the protected branch can require. CONV-GATE-002 keeps the heavy suites
# off a push to a feature branch.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  locked-restore:
    name: Locked restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode

  public-surface:
    name: Public surface files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: dotnet build Janus.slnx --no-restore

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: dotnet format Janus.slnx --verify-no-changes --no-restore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: dotnet test Janus.slnx --no-restore -- --filter-trait "kind=unit"

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: dotnet test tests/Janus.Core.Tests --no-restore -- --filter-trait "kind=contract"

  unicode-tables:
    name: Unicode tables regenerate without a diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: dotnet run --project tools/Janus.UnicodeTables --no-restore
      - run: git diff --exit-code -- src/Janus.Core/Unicode

  integration-tests:
    name: Integration tests
    # CONV-GATE-002: the containerised runs are for a pull request and the default
    # branch, not for every push to a feature branch.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: dotnet test tests/Janus.Storage.Tests --no-restore -- --filter-trait "kind=integration"

  double-migration:
    name: Double migration run
    # CONV-GATE-002: the containerised runs are for a pull request and the default
    # branch, not for every push to a feature branch.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      # The second run starts from the previous release, so the tags have to be here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: dotnet tool restore
      - run: ./.github/gates/double-migration.sh

  janus-analyzers:
    name: Janus.Analyzers rules JAN0001 to JAN0006
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: dotnet test tests/Janus.Analyzers.Tests --no-restore

  analyzer-permitted-outcome:
    name: Analyzer no permitted outcome from a catch block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: >
          dotnet test tests/Janus.Analyzers.Tests --no-restore --
          --filter-class "*PermittedOutcomeFromCatchAnalyzerTests"

  analyzer-forbidden-log-values:
    name: Analyzer no forbidden values in logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: >
          dotnet test tests/Janus.Analyzers.Tests --no-restore --
          --filter-class "*NeverLoggedValueAnalyzerTests"

  dependency-allow-list:
    name: Dependency allow-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: >
          dotnet test tests/Janus.Core.Tests --no-restore --
          --filter-method "*CONV_DESIGN_008_AC1*"

  internals-visible-to:
    name: InternalsVisibleTo allow-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: >
          dotnet test tests/Janus.Core.Tests --no-restore --
          --filter-method "*CONV_LAYOUT_002_AC1*"

  secret-scanning:
    name: Secret scanning
    # OPS-DEP-004 defines the scan as the full history on every push. On a pull
    # request the action scans that request's commits instead, which is the smaller
    # scan the item does not ask for.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  forbidden-markers:
    name: Forbidden markers and commented-out code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./.github/gates/forbidden-markers.sh

  acceptance-test-names:
    name: Acceptance-criterion test names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./.github/gates/acceptance-test-names.sh

  commit-message:
    name: Commit message format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          RANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./.github/gates/commit-message.sh "$RANGE_BASE" "$RANGE_HEAD"

  changelog:
    name: Changelog line present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          RANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./.github/gates/changelog.sh "$RANGE_BASE" "$RANGE_HEAD"

  destructive-operations:
    name: Destructive-operation detection report
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./.github/gates/destructive-operations.sh

  dependency-vulnerabilities:
    name: Dependency vulnerability alerting
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Janus.slnx --locked-mode
      - run: ./.github/gates/dependency-vulnerabilities.sh
