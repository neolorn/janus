name: leaked-passwords

# AUTH-PASS-004 and CONV-VCS-005 (D-197, D-245): dispatched by hand at each release, the
# draw of tools/leaked-passwords runs on a hosted runner, and its artifact is the dated
# list the release refreshes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draw:
    name: Draw the leaked-password list
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/leaked-passwords/draw.py --output "$RUNNER_TEMP/leaked-passwords.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leaked-passwords
          path: ${{ runner.temp }}/leaked-passwords.txt
          if-no-files-found: error
